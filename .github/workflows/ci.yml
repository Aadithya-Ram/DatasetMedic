name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m venv .venv
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check src tests scripts
      - run: npm ci
        working-directory: web
      - run: python scripts/generate_schema.py
      - run: npm run types
        working-directory: web
      - run: git diff --exit-code -- web/openapi.json web/src/schema.d.ts
      - run: npm run build
        working-directory: web
      - run: python -m build
      - run: python scripts/check_wheel.py
      - run: python scripts/install_built_wheel.py
      - run: python -c "from datasetmedic.app import create_app; from fastapi.testclient import TestClient; app=create_app(); client=TestClient(app); assert client.get('/').status_code == 200"
      - run: npm exec playwright -- install --with-deps chromium
        working-directory: web
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
      - run: npm run test:e2e
        working-directory: web
        env:
          DATASETMEDIC_PYTHON: python
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
